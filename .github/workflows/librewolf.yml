name: Update LibreWolf cask

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  permissions:
    contents: write
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get latest version from RSS
        id: latest
        run: |
          VERSION=$(curl -s https://librewolf.dev/librewolf/bsys6/releases.rss \
            | sed -n '/<item>/,$p' \
            | sed -n 's/.*<title>\(.*\)<\/title>.*/\1/p' \
            | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare with current cask version
        id: current
        run: |
          CURRENT=$(sed -n 's/.*version "\([^"]*\)".*/\1/p' Casks/librewolf.rb | head -1)
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Update cask if new version
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          NEW="${{ steps.latest.outputs.version }}"
          SUMS=$(curl -sL "https://dl.librewolf.net/librewolf/$NEW/sha256sums.txt")
          SHA=$(echo "$SUMS" | awk -v pkg="librewolf-$NEW-macos-arm64-package.dmg" '$0 ~ pkg {print $1}')

          sed -i "s/version \".*\"/version \"$NEW\"/" Casks/librewolf.rb
          sed -i "s/sha256 \".*\"/sha256 \"$SHA\"/" Casks/librewolf.rb

        echo "new_version=$NEW" >> "$GITHUB_ENV"

      - name: Create PR
        if: steps.latest.outputs.version != steps.current.outputs.version
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "librewolf: update to ${{ env.new_version }}"
          title: "librewolf: update to ${{ env.new_version }}"
          branch: bump-librewolf-${{ env.new_version }}
          base: main